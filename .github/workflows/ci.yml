name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Install from the committed lockfile. Resolving vitest@^4 from scratch
      # crashes npm 10's resolver, and the lockfile already carries the Linux
      # rollup binary, so a clean re-resolve is neither needed nor safe.
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
